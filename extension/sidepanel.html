<!doctype html>
<html><head><meta charset="utf-8"><title>TrustLens</title>
<style>
  :root { --paper:#f5f7fb; --ink:#0b1220; --ink2:#4b5567; --rule:#d5dbe6; --navy:#0b2a5b; --teal:#12a39a; --scan:#ff4d00; }
  html,body { margin:0; background:var(--paper); color:var(--ink); font:14px/1.45 Inter, system-ui, sans-serif; }
  .mono { font-family: ui-monospace, Menlo, monospace; font-variant-numeric: tabular-nums; }
  .eyebrow { font-family: ui-monospace, monospace; font-size:10px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink2); }
  header { display:flex; align-items:center; gap:10px; padding:12px 16px; border-bottom:1px solid var(--rule); }
  header img { height:26px; } .wordmark { font-family: Georgia, serif; font-size:20px; line-height:1; } .wordmark b { color:var(--teal); font-weight:400; }
  header .tag { margin-left:auto; text-align:right; }
  main { padding:16px; }
  button { font:inherit; cursor:pointer; }
  .primary { width:100%; background:var(--navy); color:#fff; border:0; padding:13px; letter-spacing:.04em; font-size:15px; }
  .primary:hover { background:var(--scan); } .primary:disabled { opacity:.5; }
  .primary.live { background:linear-gradient(90deg,var(--navy) 0%,var(--navy) 35%,var(--scan) 50%,var(--navy) 65%); background-size:250% 100%; animation: shimmer 1.6s linear infinite; } @keyframes shimmer { from { background-position:200% 0 } to { background-position:-50% 0 } }
  .hint { font-size:12px; color:var(--ink2); margin-top:8px; }
  details { margin-top:10px; } summary { cursor:pointer; }
  textarea { width:100%; box-sizing:border-box; border:1px solid var(--rule); background:#fff; padding:8px; font:12px ui-monospace, monospace; resize:vertical; margin-top:6px; }
  .status { margin-top:14px; display:flex; justify-content:space-between; align-items:baseline; } .blink { animation: blink 1s steps(1) infinite; } @keyframes blink { 50% { opacity:0 } }
  .track { height:4px; background:#e1e6ef; margin-top:8px; } .track i { display:block; height:100%; width:0; background:linear-gradient(90deg,var(--teal),var(--scan)); transition:width .2s; }
  .log { margin-top:8px; height:78px; overflow:hidden; font:11px ui-monospace, monospace; color:var(--ink2); display:flex; flex-direction:column; justify-content:flex-end; border-left:2px solid var(--scan); padding-left:8px; }
  .log div { animation: rise .25s both; } .log .sig { color:var(--scan); font-weight:600; }
  .chips { display:flex; flex-wrap:wrap; gap:5px; margin-top:10px; }
  .chip { border:1px solid var(--rule); color:var(--ink2); padding:2px 7px; font:11px ui-monospace, monospace; animation: pop .35s both; } .chip.on { border-color:var(--scan); color:var(--ink); }
  @keyframes pop { from { opacity:0; transform:scale(.85) } to { opacity:1; transform:none } }
  @keyframes rise { from { opacity:0; transform:translateY(8px) } to { opacity:1; transform:none } }
  .cat { margin-top:14px; animation: rise .45s both; } .cat .row { display:flex; justify-content:space-between; align-items:baseline; }
  .bar { height:3px; background:#e1e6ef; margin-top:4px; } .bar i { display:block; height:100%; background:var(--navy); animation: grow .8s both; } @keyframes grow { from { width:0 } }
  ul { margin:6px 0 0; padding-left:16px; color:var(--ink2); font-size:12px; } .okmsg { color:var(--teal); font-size:12px; margin-top:4px; }
  .grade { display:flex; gap:16px; align-items:center; margin-top:18px; padding-top:14px; border-top:1px solid var(--rule); animation: rise .5s both; }
  .grade .letter { font-family: Georgia, serif; font-size:96px; line-height:.9; color:var(--navy); } .bad { color:var(--scan) !important; } .good { color:var(--teal) !important; }
  .links { display:flex; gap:8px; margin-top:12px; flex-wrap:wrap; } .links a, .links button { border:1px solid var(--navy); background:none; padding:7px 10px; font-size:12px; color:var(--navy); text-decoration:none; } .links .fill { background:var(--navy); color:#fff; } .links a:hover, .links button:hover { background:var(--teal); color:#fff; border-color:var(--teal); }
  .meter { margin-top:14px; border:1px solid var(--rule); padding:10px 12px; font:11px ui-monospace, monospace; display:grid; grid-template-columns:1fr auto; gap:3px 12px; } .meter b { font-weight:600; color:var(--ink); } .meter .k { color:var(--ink2); } .meter .total { border-top:1px solid var(--rule); padding-top:4px; margin-top:3px; grid-column:1 / -1; display:flex; justify-content:space-between; font-size:12px; }
  .warn { border:1px solid var(--scan); padding:8px; font-size:12px; margin-top:12px; }
  .err { color:var(--scan); margin-top:10px; font-size:12px; }
  .sheet { position:fixed; inset:0; background:rgba(11,18,32,.55); display:flex; align-items:flex-end; padding:12px; z-index:9; } .sheet > div { background:var(--paper); border:1px solid var(--navy); padding:14px; width:100%; animation: rise .3s both; }
  .sheet img { width:100%; border:1px solid var(--rule); margin-top:10px; } .grid2 { display:grid; grid-template-columns:1fr 1fr; gap:6px; margin-top:10px; } .grid2 a, .grid2 button { border:1px solid var(--navy); background:none; padding:8px; font-size:12px; text-align:center; color:var(--navy); text-decoration:none; } .grid2 a:hover, .grid2 button:hover { background:var(--navy); color:#fff; }
</style></head>
<body>
<header><img src="logo.png" alt=""><div class="wordmark">Trust<b>Lens</b></div><div class="tag"><div id="host" class="mono" style="font-size:12px"></div><div class="eyebrow">niche auto-detected by Jev</div></div></header>
<main>
  <button id="scan" class="primary">Scan this page</button>
  <div class="hint">Boxes every element on the page, extracts 12 signals in code, then asks TypeSafe&rsquo;s Jev four questions in one call. The score appears only after the whole page has been read.</div>
  <details><summary class="eyebrow">Compare against competitors (optional)</summary><textarea id="competitors" rows="2" placeholder="keystoneprep.com&#10;solomonadmissions.com"></textarea></details>
  <div id="out"></div>
</main>
<div id="sheet"></div>
<script src="sidepanel.js"></script>
</body></html>
